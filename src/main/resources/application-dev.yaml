spring:
  config:
    import: optional:file:./application-local.yaml
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/xepdb1}
    username: ${DB_USERNAME:MANADB}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
app:
  jwt:
    # El secreto se proporciona por entorno o por configuración local ignorada.
    secret: ${JWT_SECRET}
  admin:
    email: ${MANA_ADMIN_EMAIL:admin@mana.pe}
    password: ${MANA_ADMIN_PASSWORD:}
    dni: ${MANA_ADMIN_DNI:00000001}
