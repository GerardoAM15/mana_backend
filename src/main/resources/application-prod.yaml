spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  jwt:
    secret: ${JWT_SECRET}
  admin:
    email: ${MANA_ADMIN_EMAIL:}
    password: ${MANA_ADMIN_PASSWORD:}
    dni: ${MANA_ADMIN_DNI:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
